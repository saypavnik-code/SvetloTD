name: Verify and deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: game-pages
  cancel-in-progress: true
jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 scripts/generate_art.py
      - run: git diff --exit-code -- public/assets/tiles
      - run: python3 scripts/validate_game.py
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run build
      - run: python3 scripts/check_bundle.py
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
