<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F0EEE9" />
  <title>Svetlogorsk TD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1A1410;
      color: #F6EBD8;
      font-family: "Trebuchet MS", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    #game-container canvas {
      /* High-DPI bilinear/bicubic canvas filtering for supersampled HD textures. */
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.78);
      border: 2px solid #8A6A32;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
